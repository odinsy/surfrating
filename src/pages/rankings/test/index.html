<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рейтинг спортсменов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../../styles/main-test.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: #112D4E;">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="//topheats.ru">
                <img src="../../../img/th-white-logo-min.png" alt="TopHeats" height="40">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#navbarOffcanvas" aria-controls="navbarOffcanvas" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <div class="d-flex ms-auto gap-3 align-items-center">
                    <div class="dropdown">
                        <button class="btn btn-outline-light dropdown-toggle" type="button" id="competitionDropdownDesktop" data-bs-toggle="dropdown" aria-expanded="false">
                            <span id="competitionLabel">Чемпионат России</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="competitionDropdownDesktop">
                            <li><a class="dropdown-item competition-option active" href="#" data-competition="rfs/rus">Чемпионат России (РФС)</a></li>
                            <li><a class="dropdown-item competition-option" href="#" data-competition="rfs/dfo">Чемпионат ДФО (РФС)</a></li>
                            <li><a class="dropdown-item competition-option" href="#" data-competition="rfs/spb">Чемпионат Санкт-Петербурга (РФС)</a></li>
                            <li><a class="dropdown-item competition-option" href="#" data-competition="rfs/kgd">Чемпионат Калининградской области (РФС)</a></li>
                            <li><a class="dropdown-item competition-option" href="#" data-competition="rfs/vdk">Чемпионат Приморского края (РФС)</a></li>
                            <li><a class="dropdown-item competition-option" href="#" data-competition="rfs/krd">Чемпионат Краснодарского края (РФС)</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="navbarOffcanvas" aria-labelledby="navbarOffcanvasLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="navbarOffcanvasLabel">Управление</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <div class="mb-3">
                <label for="competitionSelectMobile" class="form-label">Соревнование</label>
                <select class="form-select" id="competitionSelectMobile">
                    <option value="rfs/rus" selected>Чемпионат России (РФС)</option>
                    <option value="rfs/dfo">Чемпионат ДФО (РФС)</option>
                    <option value="rfs/spb">Чемпионат Санкт-Петербурга (РФС)</option>
                    <option value="rfs/kgd">Чемпионат Калининградской области (РФС)</option>
                    <option value="rfs/vdk">Чемпионат Приморского края (РФС)</option>
                    <option value="rfs/krd">Чемпионат Краснодарского края (РФС)</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="discipline-select-mobile" class="form-label">Дисциплина</label>
                <select id="discipline-select-mobile" class="form-select">
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Пол</label>
                <div class="btn-group w-100" role="group" aria-label="Выбор пола">
                    <button type="button" class="btn btn-outline-primary gender-btn active" data-gender="men">Мужчины</button>
                    <button type="button" class="btn btn-outline-primary gender-btn" data-gender="women">Женщины</button>
                </div>
            </div>
        </div>
    </div>

    <main class="flex-grow-1">
        <div class="container mt-3">
            <div class="row mb-3 d-none d-lg-flex">
                <div class="col-lg-6 mb-2">
                    <label for="discipline-select" class="form-label">Дисциплина</label>
                    <select id="discipline-select" class="form-select">
                    </select>
                </div>
                <div class="col-lg-6 d-flex align-items-end">
                    <div class="btn-group w-100" role="group" aria-label="Выбор пола">
                        <button type="button" class="btn btn-outline-primary gender-btn active" data-gender="men">Мужчины</button>
                        <button type="button" class="btn btn-outline-primary gender-btn" data-gender="women">Женщины</button>
                    </div>
                </div>
            </div>
            <div id="ranking-table-container" class="table-responsive"></div>
        </div>
    </main>

    <footer class="footer mt-auto py-3 bg-light border-top">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <div class="text-muted">
                    &copy; TopHeats. Все права защищены.
                </div>
                <div>
                    <span class="text-muted me-2">Обновлено:</span>
                    <span id="last-updated" class="fw-bold">-</span>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/transliteration@2.3.5/dist/browser/bundle.umd.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
