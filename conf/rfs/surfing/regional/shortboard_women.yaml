  - data/rfs/surfing/kgd/shortboard/shortboard-women-2024.csv
  - data/rfs/surfing/kgd/shortboard/shortboard-women-2025.csv

  - data/rfs/surfing/krd/shortboard/shortboard-women-2024.csv
  - data/rfs/surfing/krd/shortboard/shortboard-women-2025.csv

  - data/rfs/surfing/mmk/shortboard/shortboard-women-2025.csv

  - data/rfs/surfing/ptk/shortboard/shortboard-women-2024.csv

  - data/rfs/surfing/spb/shortboard/shortboard-women-2024.csv
  - data/rfs/surfing/spb/shortboard/shortboard-women-2025.csv

  - data/rfs/surfing/vdk/shortboard/shortboard-women-2024.csv
  - data/rfs/surfing/vdk/shortboard/shortboard-women-2025.csv

  - data/rfs/surfing/dfo/shortboard/shortboard-women-2024.csv
  - data/rfs/surfing/dfo/shortboard/shortboard-women-2025.csv

